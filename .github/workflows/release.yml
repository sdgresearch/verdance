name: Release

# Builds the sdist + wheel and publishes to PyPI when a version tag is pushed.
#
# Publishing uses PyPI Trusted Publishing (OpenID Connect) — no API token is
# stored in the repository. Before the first tagged release, a maintainer must
# configure the Trusted Publisher once on PyPI:
#   PyPI project:  verdance
#   Owner:         sdgresearch        (GitHub org that owns the repo)
#   Repository:    verdance
#   Workflow:      release.yml
#   Environment:   pypi
# See https://docs.pypi.org/trusted-publishers/ for the exact steps.
#
# Cut a release by pushing an annotated tag that matches v* on a commit whose
# src/verdance/__init__.py __version__ matches. The tag has to land on this
# repository (sdgresearch/verdance), because that is where this workflow and the
# PyPI Trusted Publisher are configured — a tag pushed to a fork publishes
# nothing. Branches still only ever go to a fork; the version tag is the one
# exception. From a maintainer's fork clone, that is the remote pointing at
# sdgresearch/verdance (`upstream` in the layout AGENTS.md describes):
#   git tag -a v0.4.0 -m "verdance 0.4.0"
#   git push upstream v0.4.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python3 -c 'import re, pathlib; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("src/verdance/__init__.py").read_text()).group(1))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match src/verdance/__init__.py (__version__=${PKG_VERSION})" >&2
            exit 1
          fi

      - name: Verify CITATION.cff matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CFF_VERSION="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)"
          if [ "$CFF_VERSION" != "$TAG_VERSION" ]; then
            echo "CITATION.cff version=${CFF_VERSION} does not match tag v${TAG_VERSION}" >&2
            exit 1
          fi
          CFF_DATE="$(sed -nE 's/^date-released:[[:space:]]*"?([0-9-]+)"?[[:space:]]*$/\1/p' CITATION.cff)"
          if [ "$CFF_DATE" \> "$(date -u +%F)" ]; then
            echo "CITATION.cff date-released=${CFF_DATE} is in the future" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Trusted Publisher on PyPI is scoped to this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/verdance/
    permissions:
      # Required for Trusted Publishing (OIDC token exchange with PyPI).
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
