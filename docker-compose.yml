# Convenience wiring for running verdance in Docker.
#
#   docker compose build
#   docker compose run --rm verdance run -c /config/city.yaml -p T3 --buffer 50
#   docker compose run --rm --service-ports verdance viz -c /config/city.yaml --host 0.0.0.0 --no-browser
#
# The `verdance` entrypoint is inherited from the image, so the command you pass
# to `docker compose run` is the CLI arguments (e.g. `run -c ... -p T30`).
# Reference the container paths below inside the YAML config, e.g.
# `census_boundaries: /data/wards.gpkg` and `output.base_dir: /output`.
services:
  verdance:
    build:
      context: .
      dockerfile: Dockerfile
    image: verdance:latest
    # Write files as your host user (uncomment and set UID/GID, e.g. `UID=$(id -u) GID=$(id -g) docker compose ...`)
    # user: "${UID}:${GID}"
    volumes:
      # Your input data.
      - ./data:/data
      # YAML config file(s).
      - ./config:/config
      # Outputs: point output.base_dir here.
      - ./output:/output
      # Download cache shared between runs (CHM tiles, Earth Engine rasters, OSM).
      - ./cache:/cache
      # Uncomment for the Earth Engine features (Spectral, GEE canopy, open_buildings,
      # remote heights, terrain). Authenticate once on the host with
      # `earthengine authenticate`, then mount the credentials read-only:
      # - ${HOME}/.config/earthengine:/home/verdance/.config/earthengine:ro
    ports:
      - "8765:8765"   # verdance viz (with --host 0.0.0.0)
    environment:
      VERDANCE_CACHE_DIR: /cache
      # Spark heap — raise it if you have the RAM.
      SPARK_DRIVER_MEMORY: 4g
